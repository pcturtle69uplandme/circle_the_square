<head>
<meta charset="UTF-8" />

<title>CTS Bubble Studio — F01</title>
<style>
  :root {
    --orange: #B0381F;
    --orange-light: #E04B28;
    --gold: #F2A34D;
    --bg: #0A0A0C;
    --bg2: #111116;
    --bg3: #18181F;
    --bg4: #1E1E28;
    --border: rgba(255,255,255,0.08);
    --text: #E8E6F0;
    --text-muted: #8A87A0;
    --text-dim: #4E4B60;
    --green: #2ECC71;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    min-height: 100vh;
  }

  /* ── Layout ───────────────────────────────────────────── */
  .layout {
    display: grid;
    grid-template-columns: 1fr 320px;
    max-width: 1400px;
    margin: 0 auto;
    padding: 20px 20px 60px;
    gap: 24px;
    align-items: start;
  }

  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
  }

  /* ── Stage ────────────────────────────────────────────── */
  .stage {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
  }

  .stage-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    font-size: 0.78rem;
    color: var(--text-muted);
  }
  .badge {
    background: var(--bg4);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px 9px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--gold);
  }

  .frame-container {
    position: relative;
    aspect-ratio: 1376 / 768;
    background: var(--bg4);
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--border);
    cursor: crosshair;
    user-select: none;
  }

  /* Full-bleed frame image — covers entire container, no letterbox */
  .frame-container img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
  }

  .frame-container.drag-bubble { cursor: grabbing; }

  /* ── Speech Bubble ─────────────────────────────────────── */
  .bubble {
    position: absolute;
    background: #fdfaf3;
    color: #1a1a1a;
    border-radius: 18px;
    padding: 12px 18px;
    font-size: 0.95rem;
    line-height: 1.4;
    max-width: 50%;
    box-shadow: 0 6px 20px rgba(0,0,0,0.45);
    border: 2px solid #1a1a1a;
    cursor: grab;
    z-index: 10;
    /* No transitions on position — the bubble must jump to its saved spot */
    left: 0; top: 0;
    transition: opacity 0.15s;
  }
  .bubble:active { cursor: grabbing; }
  .bubble .speaker {
    font-weight: 800;
    text-transform: uppercase;
    font-size: 0.68rem;
    letter-spacing: 0.05em;
    color: var(--orange);
    margin-bottom: 2px;
    display: block;
  }
  /* ── Bubble Resize handle ──────────────────────────────── */
  .bubble-handle {
    position: absolute;
    top: -12px;
    right: -12px;
    width: 24px;
    height: 24px;
    background: var(--orange);
    border: 2px solid #1a1a1a;
    border-radius: 50%;
    cursor: nwse-resize;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: #fff;
    font-weight: 900;
    z-index: 12;
    opacity: 0;
    transition: opacity .15s;
    user-select: none;
  }
  .bubble:hover .bubble-handle { opacity: 1; }
  .bubble-handle:hover { background: var(--orange-light); cursor: grabbing; }

  /* ── Controls Panel ─────────────────────────────────────── */
  .panel {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .panel h2 {
    font-size: 1rem;
    font-weight: 700;
    color: var(--gold);
    border-bottom: 1px solid var(--border);
    padding-bottom: 10px;
  }

  .panel-section h3 {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    margin-bottom: 10px;
  }

  /* Sliders */
  .slider-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .slider-row label {
    font-size: 0.78rem;
    color: var(--text-muted);
    min-width: 80px;
  }
  .slider-row input[type=range] {
    flex: 1;
    accent-color: var(--orange);
    cursor: pointer;
  }
  .slider-row .val {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: var(--gold);
    min-width: 36px;
    text-align: right;
  }

  /* Buttons */
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    transition: all .15s;
    flex: 1;
    text-align: center;
  }
  .btn:hover { border-color: var(--gold); color: var(--text); }
  .btn.active { background: var(--orange); border-color: var(--orange-light); }
  .btn.play-btn {
    background: var(--bg4);
    border-color: var(--green);
    color: var(--green);
    flex: 2;
  }
  .btn.play-btn:hover { background: var(--green); color: var(--bg); border-color: var(--green); }
  .btn.play-btn.playing {
    background: var(--orange); border-color: var(--orange-light); color: #fff;
  }
  .btn:disabled { opacity: .35; cursor: default; }

  /* Status */
  .status {
    font-size: 0.72rem;
    color: var(--text-dim);
    line-height: 1.5;
    background: var(--bg3);
    border-radius: 8px;
    padding: 10px;
  }
  .status.ok { color: var(--green); }
  .status.err { color: #E74C3C; }

  /* TTS Loading spinner */
  .spinner {
    display: inline-block;
    width: 12px; height: 12px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .7s linear infinite;
    vertical-align: middle;
    margin-right: 4px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Scene nav */
  .scene-nav { display: flex; gap: 6px; align-items: center; }
  .scene-nav label { font-size: 0.75rem; color: var(--text-muted); }
  .scene-nav select {
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 0.78rem;
    cursor: pointer;
    flex: 1;
  }

  /* Frame grid */
  .frame-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
    gap: 6px;
    max-height: 280px;
    overflow-y: auto;
    padding: 4px;
  }
  .frame-thumb {
    aspect-ratio: 2.39 / 1;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 5px;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.6rem;
    color: var(--text-dim);
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    transition: all .12s;
  }
  .frame-thumb:hover { border-color: var(--gold); color: var(--text); }
  .frame-thumb.current { background: var(--orange); border-color: var(--orange-light); color: #fff; }
  .frame-thumb.done { position: relative; }
  .frame-thumb.done::after {
    content: '●';
    position: absolute;
    top: 2px; right: 3px;
    font-size: 0.45rem;
    color: var(--green);
  }

  .hint {
    font-size: 0.68rem;
    color: var(--text-dim);
    line-height: 1.5;
    margin-top: 4px;
  }
</style>
</head>

  { id:"F52",  shot:"S31", scene:3, speaker:null,            line:"Plates swept off the counter — CRASH." },
  { id:"F53",  shot:"S31", scene:3, speaker:null,            line:"China shattered, crowd frozen." },
  { id:"F54",  shot:"S32", scene:3, speaker:"Jan (screaming)", line:"I HAVE HAD IT WITH THIS PLACE!" },
  { id:"F55",  shot:"S33", scene:3, speaker:null,            line:"Chair hurled through the window — GLASS SHATTERS." },
  { id:"F56",  shot:"S34", scene:3, speaker:null,            line:"Jan reaches for a second chair; Rick steps forward, raising the taser." },
  { id:"F57",  shot:"S34", scene:3, speaker:null,            line:"POP-CRACKLE — taser electric arc flash." },
  { id:"F58",  shot:"S34", scene:3, speaker:null,            line:"Jan freezes, drops the chair, slumps face-first." },
  { id:"F59",  shot:"S35", scene:3, speaker:"Chris",         line:"Have you killed him?" },
  { id:"F60",  shot:"S35", scene:3, speaker:"Rick",          line:"No relax, he will be out for a while." },
  { id:"F61",  shot:"S35", scene:3, speaker:"Rick",          line:"I think we need the police here." },
];

// ══════════════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════════════
let sceneFilter = "all";
let idx = 0;
let currentAudio = null;

// Drag state
let dragging = null;  // 'bubble' | 'resize'
let dragStart = { x: 0, y: 0 };
let dragStartState = {};

function visibleFrames() {
  return sceneFilter === "all" ? FRAMES : FRAMES.filter(f => f.scene === Number(sceneFilter));
}

function getCharKey(speaker) {
  if (!speaker) return null;
  const s = speaker.toLowerCase();
  if (s.includes("jan")) return "jan";
  if (s.includes("christina")) return "christina";
  if (s.includes("sharon")) return "sharon";
  if (s.includes("chris")) return "chris";
  if (s.includes("rick")) return "rick";
  if (s.includes("maureen")) return "maureen";
  if (s.includes("gemma")) return "gemma";
  if (s.includes("priya")) return "priya";
  if (s.includes("barbara")) return "barbara";
  if (s.includes("dev")) return "dev";
  if (s.includes("tomasz")) return "tomasz";
  return null;
}

function getAudioPath(frame) {
  if (!frame.speaker) return null;
  const filename = AUDIO_MAP[frame.id];
  if (filename) return `../audio-refs/${filename}`;
  const charKey = getCharKey(frame.speaker);
  if (!charKey) return null;
  const charFrames = FRAMES.filter(f => getCharKey(f.speaker) === charKey);
  const lineIdx = charFrames.findIndex(f => f.id === frame.id) + 1;
  if (lineIdx === 0) return null;
  const idxStr = String(lineIdx).padStart(2, "0");
  return `../audio-refs/${charKey}_${idxStr}.mp3`;
}

// ══════════════════════════════════════════════════════════════
// PERSISTENCE
// ══════════════════════════════════════════════════════════════
const STORAGE_KEY = "ctsBubbleStudio_v3";
// Live state object for the current frame — written by drag/preset, saved on demand
let currentState = null;
let isDirty = false;   // true when currentState differs from disk

function loadState(frameId) {
  const raw = localStorage.getItem(STORAGE_KEY + "_" + frameId);
  if (!raw) {
    console.log("[bubble] no saved state for", frameId, "— using defaults");
    return defaultState(frameId);
  }
  try {
    const s = JSON.parse(raw);
    return {
      bx: s.bx ?? 20,
      by: s.by ?? 8,
      opacity: s.opacity ?? 100,
    };
  } catch {
    console.warn("[bubble] bad localStorage for", frameId, "— using defaults");
    return defaultState(frameId);
  }
}

function defaultState(frameId) {
  return { bx: 20, by: 8, opacity: 100 };
}

function saveState(frameId, state) {
  localStorage.setItem(STORAGE_KEY + "_" + frameId, JSON.stringify(state));
  console.log("[bubble] saved", frameId, "→ bx:", state.bx, "by:", state.by);
  isDirty = false;
}

function markDirty() {
  isDirty = true;
}

// ══════════════════════════════════════════════════════════════
// APPLY STATE → DOM
// ══════════════════════════════════════════════════════════════
function applyState(s) {
  const bubble = document.getElementById("bubble");
  const container = document.getElementById("frameContainer");
  const cw = container.offsetWidth;
  const ch = container.offsetHeight;

  // Guard: if container has no size yet, skip positioning.
  // The next renderFrame (after layout) will apply the correct position.
  if (!cw || !ch) return;

  bubble.style.left = (s.bx / 100) * cw + "px";
  bubble.style.top  = (s.by / 100) * ch + "px";
  bubble.style.opacity = s.opacity / 100;
}

function renderFrame() {
  const frames = visibleFrames();
  if (idx < 0) idx = 0;
  if (idx >= frames.length) idx = frames.length - 1;
  const f = frames[idx];
  if (!f) return;

  if (currentAudio) { currentAudio.pause(); currentAudio = null; }

  document.getElementById("frameBadge").textContent = f.id;
  document.getElementById("shotBadge").textContent = f.shot;
  const scene = SCENES.find(s => s.id === f.scene);
  document.getElementById("sceneLabel").textContent = scene ? scene.label : "—";

  // Load image — looks in storyboard-frames/ relative to the HTML file
  const img = document.getElementById("frameImg");
  img.style.display = "none";
  img.onload = () => { img.style.display = "block"; };
  img.onerror = () => { img.style.display = "none"; };
  img.src = `../storyboard-frames/${f.id}.jpg`;

  const speakerEl = document.getElementById("bubbleSpeaker");
  const lineEl    = document.getElementById("bubbleLine");
  const bubble    = document.getElementById("bubble");

  if (f.speaker) {
    bubble.hidden = false;
    bubble.className = "bubble";
    speakerEl.textContent = f.speaker;
    lineEl.textContent = f.line;
  } else {
    // No speaker = an action/SFX description (e.g. "Door clicks shut — calm
    // exit."), written for video-production planning, not dialogue — no
    // caption needed for these frames.
    bubble.hidden = true;
  }

  const state = loadState(f.id);
  currentState = state;
  isDirty = false;
  applyState(state);
  syncSliders(state);
  autoPlay(f);
}

function syncSliders(s) {
  document.getElementById("opacitySlider").value = s.opacity;
}

// ══════════════════════════════════════════════════════════════
// DRAG — BUBBLE / RESIZE
// ══════════════════════════════════════════════════════════════
const container = document.getElementById("frameContainer");
const bubble   = document.getElementById("bubble");

container.addEventListener("mousedown", onMouseDown);
container.addEventListener("touchstart", onTouchStart, { passive: false });
document.addEventListener("mousemove", onMouseMove);
document.addEventListener("touchmove", onTouchMove, { passive: false });
document.addEventListener("mouseup", onMouseUp);
document.addEventListener("touchend", onMouseUp);

function getPos(e) {
  const r = container.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

function onMouseDown(e) {
  const f = visibleFrames()[idx];
  if (!f || !currentState) return;
  const target = e.target;

  // ── Bubble resize handle (orange circle, top-right of bubble) ──
  if (target.classList.contains("bubble-handle")) {
    dragging = "resize";
    dragStart = getPos(e);
    dragStartState = { bx: currentState.bx, by: currentState.by };
    e.preventDefault();
    return;
  }

  // ── Bubble body drag ─────────────────────────────────────
  if (target === bubble || target.closest("#bubble")) {
    dragging = "bubble";
    dragStart = getPos(e);
    dragStartState = { bx: currentState.bx, by: currentState.by };
    container.classList.add("drag-bubble");
    e.preventDefault();
    return;
  }
}

function onTouchStart(e) { onMouseDown(e.touches[0]); }

function onMouseMove(e) {
  if (!dragging) return;
  const f = visibleFrames()[idx];
  if (!f || !currentState) return;

  const r = container.getBoundingClientRect();
  const cx = e.clientX - r.left;
  const cy = e.clientY - r.top;
  const cw = r.width;
  const ch = r.height;

  // ── Bubble move ───────────────────────────────────────────
  if (dragging === "bubble") {
    const dx = cx - dragStart.x;
    const dy = cy - dragStart.y;
    currentState.bx = Math.max(2, Math.min(98, dragStartState.bx + (dx / cw) * 100));
    currentState.by = Math.max(2, Math.min(98, dragStartState.by + (dy / ch) * 100));
    applyState(currentState);
    markDirty();
    e.preventDefault();
    return;
  }

  // ── Resize handle: drag corner to resize bubble ───────────
  if (dragging === "resize") {
    const dx = cx - dragStart.x;
    const dy = cy - dragStart.y;
    currentState.bx = Math.max(2, Math.min(98, dragStartState.bx + (dx / cw) * 100));
    currentState.by = Math.max(2, Math.min(98, dragStartState.by + (dy / ch) * 100));
    applyState(currentState);
    markDirty();
    e.preventDefault();
    return;
  }
}

function onTouchMove(e) { onMouseMove(e.touches[0]); }

function onMouseUp(e) {
  if (!dragging) return;
  // Auto-save on drag end so the position sticks
  const f = visibleFrames()[idx];
  if (f && currentState && isDirty) saveState(f.id, currentState);
  dragging = null;
  container.classList.remove("drag-bubble");
}

// ══════════════════════════════════════════════════════════════
// SLIDERS
// ══════════════════════════════════════════════════════════════
function wireSlider(id, key) {
  const slider = document.getElementById(id);
  slider.addEventListener("input", () => {
    const f = visibleFrames()[idx];
    if (!f || !currentState) return;
    currentState[key] = parseInt(slider.value);
    applyState(currentState);
    markDirty();
    saveState(f.id, currentState);
  });
}

wireSlider("opacitySlider", "opacity");

// ══════════════════════════════════════════════════════════════
// KEYBOARD NAVIGATION
// ══════════════════════════════════════════════════════════════
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  const frames = visibleFrames();
  if (e.key === "ArrowLeft"  && idx > 0)           { idx--; renderFrame(); }
  if (e.key === "ArrowRight" && idx < frames.length - 1) { idx++; renderFrame(); }
});

// ══════════════════════════════════════════════════════════════
// TTS — AUTO-PLAY ON FRAME CHANGE
// ══════════════════════════════════════════════════════════════
function autoPlay(f) {
  if (!f || !f.speaker) return;
  const audioPath = getAudioPath(f);
  if (!audioPath) return;
  if (currentAudio) currentAudio.pause();
  currentAudio = new Audio(audioPath);
  currentAudio.volume = 0.85;
  currentAudio.addEventListener("canplaythrough", () => { currentAudio.play().catch(() => {}); });
  currentAudio.load();
}

// ══════════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════════
renderFrame();
</script>
